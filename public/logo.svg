<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="13" fill="#84cc16"/>
  <!-- three blades (Santoryu) -->
  <g stroke="#14180f" stroke-width="2.6" stroke-linecap="round">
    <line x1="24" y1="30" x2="12" y2="8"/>
    <line x1="24" y1="30" x2="24" y2="6"/>
    <line x1="24" y1="30" x2="36" y2="8"/>
  </g>
  <!-- crossguard (tsuba) -->
  <line x1="17" y1="30" x2="31" y2="30" stroke="#14180f" stroke-width="2.6" stroke-linecap="round"/>
  <!-- handle (tsuka) -->
  <line x1="24" y1="30" x2="24" y2="41" stroke="#14180f" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="24" cy="41" r="2.1" fill="#14180f"/>
</svg>
